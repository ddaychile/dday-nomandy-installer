name: Build Installer

on:
  workflow_dispatch:
    inputs:
      q2pro_tag:
        description: 'q2pro release tag (ej: r3844)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout installer repo (self)
        uses: actions/checkout@v4
        with:
          lfs: true

      # 1. Descargar binarios q2pro x64
      - name: Download q2pro x64 binaries
        run: |
          gh release download ${{ github.event.inputs.q2pro_tag }} --repo ddaychile/q2pro --pattern "q2pro-windows-x64.zip" --dir ./q2pro_x64
          Expand-Archive -Force -Path .\q2pro_x64\q2pro-windows-x64.zip -DestinationPath .\q2pro_x64
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 2. Descargar binarios q2pro x86
      - name: Download q2pro x86 binaries
        run: |
          gh release download ${{ github.event.inputs.q2pro_tag }} --repo ddaychile/q2pro --pattern "q2pro-windows-x86.zip" --dir ./q2pro_x86
          Expand-Archive -Force -Path .\q2pro_x86\q2pro-windows-x86.zip -DestinationPath .\q2pro_x86
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 3. Preparar fuentes del installer
      - name: Prepare installer sources
        run: |
          # Cliente 64-bit
          copy .\q2pro_x64\q2pro.exe .\Quake2.exe
          copy .\q2pro_x64\gamex86_64.dll .\gamex86_64.dll
          copy .\q2pro_x64\*.dll .\
          
          # Servidor 32-bit
          copy .\q2pro_x86\q2proded.exe .\q2proded.exe
          copy .\q2pro_x86\*.dll .\
          
          # Check optional DLLs and build iscc defines
          $isccDefines = @()
          
          $optionalDlls = @{
            "discord_game_sdk.dll" = "IncludeDiscordSDK"
            "avformat-63.dll" = "IncludeAvFormat"
            "avcodec-63.dll" = "IncludeAvCodec"
            "avutil-61.dll" = "IncludeAvUtil"
            "avfilter-12.dll" = "IncludeAvFilter"
            "avdevice-63.dll" = "IncludeAvDevice"
            "swresample-7.dll" = "IncludeSwResample"
            "swscale-10.dll" = "IncludeSwScale"
            "SDL2.dll" = "IncludeSDL2"
            "OpenAL32.dll" = "IncludeOpenAL32"
          }
          
          foreach ($dll in $optionalDlls.Keys) {
            if (Test-Path ".\q2pro_x64\$dll") {
              Copy-Item ".\q2pro_x64\$dll" .\
              Write-Host "$dll found and copied"
              $isccDefines += "/D$($optionalDlls[$dll])"
            } else {
              Write-Host "$dll not found - skipping (optional)"
            }
          }
          
          # Copy baseq2 and dday from Dday Normandy/ to root (where .iss expects them)
          if (Test-Path ".\Dday Normandy\baseq2") {
            Copy-Item ".\Dday Normandy\baseq2" .\baseq2 -Recurse -Force
            Write-Host "baseq2 folder copied from Dday Normandy/"
          } else {
            Write-Host "WARNING: baseq2 folder not found in Dday Normandy/"
          }
          
          if (Test-Path ".\Dday Normandy\dday") {
            Copy-Item ".\Dday Normandy\dday" .\dday -Recurse -Force
            Write-Host "dday folder copied from Dday Normandy/"
          } else {
            Write-Host "WARNING: dday folder not found in Dday Normandy/"
          }
          
          $env:ISCC_DEFINES = $isccDefines -join " "

      # 4. Actualizar versión en .iss
      - name: Update version in .iss
        run: |
          $version = "${{ github.event.inputs.q2pro_tag }}".TrimStart('r')
          (Get-Content ddayinstaller.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content ddayinstaller.iss

      # 5. Instalar Inno Setup via Chocolatey (use existing if available)
      - name: Install Inno Setup
        run: choco install innosetup --version=6.2.2 --allow-downgrade -y

      # 6. Compilar installer
      - name: Build Installer
        run: |
          $isccArgs = @("ddayinstaller.iss")
          if ($env:ISCC_DEFINES) {
            $isccArgs += $env:ISCC_DEFINES -split " "
          }
          iscc @isccArgs
        shell: pwsh

      # 7. Crear release con el instalador
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.q2pro_tag }}-installer
          name: "Dday Normandy - ${{ github.event.inputs.q2pro_tag }}"
          body: "Instalador de Dday Normandy para ${{ github.event.inputs.q2pro_tag }}"
          files: Output/DdayNormandy_Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}